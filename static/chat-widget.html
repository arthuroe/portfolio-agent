<!--
  Portfolio chat widget — styled to match a DM Serif Display / DM Sans / DM Mono
  system with an earthy green accent palette.
  Copy this block into your GitHub Pages HTML (e.g. right before </body>).
  Update API_URL to wherever you deploy app.py (Render, Fly.io, etc).
  If your page doesn't already load the DM font family, keep the <link> tag below;
  if it does, you can safely delete it to avoid loading fonts twice.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap"
  rel="stylesheet"
/>

<div id="portfolio-chat">
  <button id="chat-toggle" aria-label="Ask about Arthur">
    <span class="toggle-label">Ask about Arthur</span>
    <span class="toggle-icon">＋</span>
  </button>

  <div
    id="chat-box"
    role="dialog"
    aria-label="Chat with Arthur's portfolio assistant"
  >
    <div id="chat-header">
      <div>
        <div id="chat-title">Ask about Arthur</div>
        <div id="chat-subtitle">Grounded in his actual CV — ask away</div>
      </div>
      <button id="chat-close" aria-label="Close chat">✕</button>
    </div>

    <div id="chat-messages">
      <div class="msg bot">
        <div class="bubble">
          Hi — I can answer questions about Arthur's experience, projects, and
          skills. What would you like to know?
        </div>
      </div>
    </div>

    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="e.g. What backend work has Arthur done?"
        autocomplete="off"
      />
      <button type="submit" aria-label="Send">→</button>
    </form>
  </div>
</div>

<style>
  #portfolio-chat {
    --pa-cream: #f7f5ef;
    --pa-white: #fffefb;
    --pa-ink: #2b2b24;
    --pa-ink-muted: #6f6c5f;
    --pa-green: #3f5d4a;
    --pa-green-dark: #324a3b;
    --pa-sage: #b9c9b6;
    --pa-border: #e2ddcd;

    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--pa-ink);
  }

  #chat-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--pa-green);
    color: var(--pa-white);
    border: none;
    padding: 12px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
    box-shadow: 0 6px 20px rgba(63, 93, 74, 0.25);
    transition:
      background 0.15s ease,
      transform 0.15s ease;
  }
  #chat-toggle:hover {
    background: var(--pa-green-dark);
    transform: translateY(-1px);
  }
  #chat-toggle:focus-visible {
    outline: 2px solid var(--pa-sage);
    outline-offset: 2px;
  }
  .toggle-icon {
    font-size: 16px;
    line-height: 1;
    transition: transform 0.2s ease;
  }
  #portfolio-chat.open .toggle-icon {
    transform: rotate(45deg);
  }
  #portfolio-chat.open .toggle-label {
    display: none;
  }
  #portfolio-chat.open #chat-toggle {
    padding: 12px;
    border-radius: 50%;
  }

  #chat-box {
    display: none;
    flex-direction: column;
    width: 340px;
    max-height: 480px;
    background: var(--pa-cream);
    border: 1px solid var(--pa-border);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(43, 43, 36, 0.16);
    margin-top: 12px;
    overflow: hidden;
  }
  #portfolio-chat.open #chat-box {
    display: flex;
  }

  #chat-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 18px;
    background: var(--pa-white);
    border-bottom: 1px solid var(--pa-border);
  }
  #chat-title {
    font-family: "DM Serif Display", serif;
    font-size: 19px;
    color: var(--pa-green-dark);
    line-height: 1.2;
  }
  #chat-subtitle {
    font-family: "DM Mono", monospace;
    font-size: 11px;
    color: var(--pa-ink-muted);
    margin-top: 4px;
    letter-spacing: 0.01em;
  }
  #chat-close {
    background: none;
    border: none;
    color: var(--pa-ink-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }
  #chat-close:hover {
    color: var(--pa-ink);
  }

  #chat-messages {
    padding: 16px 18px;
    overflow-y: auto;
    flex: 1;
    max-height: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #chat-messages::-webkit-scrollbar {
    width: 6px;
  }
  #chat-messages::-webkit-scrollbar-thumb {
    background: var(--pa-sage);
    border-radius: 3px;
  }

  .msg {
    display: flex;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .msg.user {
    justify-content: flex-end;
  }
  .msg.bot {
    justify-content: flex-start;
  }

  .bubble {
    max-width: 84%;
    padding: 9px 13px;
    border-radius: 14px;
  }
  .msg.user .bubble {
    background: var(--pa-green);
    color: var(--pa-white);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--pa-white);
    color: var(--pa-ink);
    border: 1px solid var(--pa-border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble.throttled {
    font-family: "DM Mono", monospace;
    font-size: 12px;
    color: var(--pa-ink-muted);
    font-style: normal;
  }

  .typing-dots {
    display: inline-flex;
    gap: 3px;
    padding: 2px 0;
  }
  .typing-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--pa-sage);
    animation: pa-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) {
    animation-delay: 0.15s;
  }
  .typing-dots span:nth-child(3) {
    animation-delay: 0.3s;
  }
  @keyframes pa-bounce {
    0%,
    60%,
    100% {
      transform: translateY(0);
      opacity: 0.5;
    }
    30% {
      transform: translateY(-4px);
      opacity: 1;
    }
  }

  #chat-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--pa-white);
    border-top: 1px solid var(--pa-border);
  }
  #chat-input {
    flex: 1;
    border: 1px solid var(--pa-border);
    border-radius: 999px;
    padding: 9px 14px;
    font-family: "DM Sans", sans-serif;
    font-size: 13.5px;
    outline: none;
    background: var(--pa-cream);
    color: var(--pa-ink);
    transition: border-color 0.15s ease;
  }
  #chat-input:focus {
    border-color: var(--pa-green);
  }
  #chat-input:disabled {
    opacity: 0.6;
  }
  #chat-input::placeholder {
    color: var(--pa-ink-muted);
  }

  #chat-form button {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--pa-green);
    color: var(--pa-white);
    font-size: 15px;
    cursor: pointer;
    transition:
      background 0.15s ease,
      transform 0.1s ease;
  }
  #chat-form button:hover:not(:disabled) {
    background: var(--pa-green-dark);
  }
  #chat-form button:active:not(:disabled) {
    transform: scale(0.94);
  }
  #chat-form button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  @media (max-width: 420px) {
    #portfolio-chat {
      right: 12px;
      bottom: 12px;
    }
    #chat-box {
      width: calc(100vw - 24px);
    }
  }
</style>

<script>
  const API_URL = "http://127.0.0.1:8000/ask";

  const root = document.getElementById("portfolio-chat");
  const toggle = document.getElementById("chat-toggle");
  const closeBtn = document.getElementById("chat-close");
  const messages = document.getElementById("chat-messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const sendButton = form.querySelector("button");

  function openChat() {
    root.classList.add("open");
    input.focus();
  }
  function closeChat() {
    root.classList.remove("open");
  }
  toggle.addEventListener("click", () => {
    root.classList.contains("open") ? closeChat() : openChat();
  });
  closeBtn.addEventListener("click", closeChat);

  function addMessage(text, sender, opts = {}) {
    const row = document.createElement("div");
    row.className = `msg ${sender}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (opts.throttled ? " throttled" : "");
    bubble.textContent = text;
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "msg bot";
    row.id = "typing-indicator";
    row.innerHTML = `<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  let requestInFlight = false;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (requestInFlight) return; // ignore rapid double-submits

    const question = input.value.trim();
    if (!question) return;

    requestInFlight = true;
    input.disabled = true;
    sendButton.disabled = true;

    addMessage(question, "user");
    input.value = "";
    addTypingIndicator();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      document.getElementById("typing-indicator")?.remove();

      if (res.status === 429) {
        addMessage(
          data.detail || "Please wait a moment before asking again.",
          "bot",
          { throttled: true },
        );
      } else {
        addMessage(data.answer || "Sorry, something went wrong.", "bot");
      }
    } catch (err) {
      document.getElementById("typing-indicator")?.remove();
      addMessage("Sorry, I couldn't reach the server.", "bot");
    } finally {
      requestInFlight = false;
      input.disabled = false;
      sendButton.disabled = false;
      input.focus();
    }
  });
</script>
